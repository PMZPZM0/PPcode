name: Release

# ⛔ 10-10 仓库拆分后的形态：
#   本仓（ppcode-src，私有）= 源码 + 构建；公开发布仓 PMZPZM0/PPcode = 功能介绍 + 安装包
#   （应用内「检查更新」匿名拉它的 /releases/latest，所以它必须公开 —— 但公开就不能放源码）。
#   发版动作不变 = `git push origin v0.0.x` → 本工作流在本仓构建三端包，
#   publish 用 secrets.PPCODE_RELEASE_TOKEN **跨仓**发布到公开发布仓。
#   （历史：本机远端是 SSH deploy key，只能推代码/标签，建 Release/传资产必须靠 Actions ——
#     所以发布永远跑在 Actions 里，不在本机。）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# 建 Release / 传资产需要写权限（默认只读）；actions: read 供 publish 取构建 artifact
permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    # 复用唯一的 mac 构建实现（arm64 + x64 双芯片）
    uses: ./.github/workflows/build-mac.yml
    secrets: inherit

  win:
    # 复用唯一的 Windows 构建实现（含随包工具链现造）
    uses: ./.github/workflows/build-win.yml
    secrets: inherit

  # ⛔⛔ 10-12：artifact 中转与 publish 汇总作业整段删除 —— artifact 存储配额
  #（免费账户 500MB，一次三端 ~2GB）打满会让 upload-artifact 硬失败且 6-12 小时才重算，
  #  v0.1.1 / v0.1.2 连续两轮死在这一步（构建本身全绿）。现在由 build-win / build-mac
  #  各自**直传**到公开发布仓 Release（Release 资产不受该配额限制）。
