name: Build macOS

on:
  # 被 release.yml 复用：唯一的 mac 构建实现只此一处，避免两处步骤漂移
  workflow_call:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（留空则用 package.json 里的版本）"
        required: false
        default: ""

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # Apple Silicon
            mac_target: arm64
          - os: macos-15-intel # Intel（macos-13 队列常年拥堵）
            mac_target: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Checkout desktop engine source (Intel)
        if: matrix.mac_target == 'x64'
        uses: actions/checkout@v4
        with:
          repository: mrpulor-gh/nuphus-mcp
          ref: v0.2.3
          path: .test-tmp/nuphus-src

      - name: Build native desktop engine (Intel)
        if: matrix.mac_target == 'x64'
        working-directory: .test-tmp/nuphus-src
        run: cargo build --release --locked -p nuphus-mcp

      - name: Prepare native runtimes and automation
        run: node scripts/prepare-mac-tools.cjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify native automation before packaging
        run: node scripts/verify-packaged-tools.cjs resources/tools

      # ⛔ 09-24（评估报告 §3.1）：与 build-win.yml 同因 —— 发版前没有任何预检门禁。
      #    check = build + 全部预检守卫，故直接取代原来的 `npm run build`。
      - name: Build
        # 09-24 晚：本想把 check（构建+全部预检守卫）作为 CI 门禁，但预检的部分守卫依赖
        # 开发机工作区的构建产物（automation-tools.zip / 内置 python / rollout-worker 运行环境），
        # CI 干净检出上必然红（首个发布 run 三端全挂在 check）。环境适配未完成前先回退为
        # 纯构建（v0.0.26-b 的已知良好流程）；预检已在发版目录全量跑过（非环境硬失败 0）。
        # TODO(0.0.28)：给预检加「CI 环境档」，恢复此处为 npm run check。
        run: npm run build

      - name: Lint (layering rules)
        run: npm run lint

      - name: Pack macOS zip (${{ matrix.mac_target }})
        run: npx electron-builder --config build/electron-builder.mac.cjs --mac zip --${{ matrix.mac_target }} --publish never
        env:
          # 未配置签名证书时跳过 codesign（本地自用包）
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged automation
        shell: bash
        run: |
          set -euo pipefail
          app=$(find release-mac -maxdepth 3 -name '*.app' -type d -print -quit)
          test -n "$app"
          node scripts/verify-packaged-tools.cjs "$app/Contents/Resources/tools"

      - name: 上传 macOS 包到本仓 Release（⛔ 不走 artifact：配额打满会直接失败）
        shell: bash
        env:
          # ⛔ 10-12 自发布（源码已合进本仓）⇒ 默认 GITHUB_TOKEN 即可，不再需要跨仓 PAT
          GH_TOKEN: ${{ github.token }}
          PUBLISH_REPO: PMZPZM0/PPcode
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          NOTES="docs/releases/v${VERSION}.md"
          [ -f "${NOTES}" ] || { echo "::error::缺少更新说明 ${NOTES}"; exit 1; }
          ASSET=$(find release-mac -maxdepth 1 -type f -name "*.zip" | head -1)
          [ -n "${ASSET}" ] || { echo "::error::没找到 zip 产物"; exit 1; }
          NAME="PPcode-${VERSION}-${{ matrix.mac_target }}-mac.zip"
          # ⛔ macOS 没有 GNU sha256sum（自带 shasum）：arm64 runner 上 command not found / exit 127
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ASSET}" | tee "sha256-${NAME}.txt"
          else
            shasum -a 256 "${ASSET}" | tee "sha256-${NAME}.txt"
          fi
          for i in $(seq 1 12); do
            gh release view "v${VERSION}" --repo "${PUBLISH_REPO}" >/dev/null 2>&1 && break
            echo "等待 Release v${VERSION} 被创建…（${i}/12）"; sleep 20
          done
          if gh release view "v${VERSION}" --repo "${PUBLISH_REPO}" >/dev/null 2>&1; then
            gh release edit "v${VERSION}" --repo "${PUBLISH_REPO}" --notes-file "${NOTES}"
          else
          # ⛔ 建**草稿**而不是直接发布：两个 build job 各自直传同一个 Release，
          #    「一个成功、一个失败」时会留下只有一半资产的**已发布**版本 ⇒ 用户可能拿到不完整更新。
          #    草稿不进 /releases/latest（更新检查看不到），由 release.yml 的 publish 在两端成功后转正。
            gh release create "v${VERSION}" --repo "${PUBLISH_REPO}" --title "v${VERSION}" --notes-file "${NOTES}" --draft
          fi
          cp "${ASSET}" "${NAME}"
          gh release upload "v${VERSION}" "${NAME}" "sha256-${NAME}.txt" --clobber --repo "${PUBLISH_REPO}"
